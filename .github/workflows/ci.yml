# .github/workflows/ci.yml
# Lint and test on every push and pull request, on all three OSes: the
# journal's durability and permissions are platform-sensitive.
name: CI

# Paused 2026-10-13: the account's GitHub Actions minutes ran out. The
# workflow runs only when started by hand (Actions → CI → Run workflow).
# To resume on every push and pull request, put back:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
# make check runs the same checks locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
