# .golangci.yml
#
# Pins the lint contract so every developer, and CI, see the same findings.
# Mirrors Helix's config. The pin is golangci-lint v2.13.2, which is tied to
# the Go toolchain (1.27): bump both together.
#
#   go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # v2's standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

issues:
  # Report every occurrence. Capped output understates a problem.
  max-same-issues: 0
  max-issues-per-linter: 0
  uniq-by-line: true
